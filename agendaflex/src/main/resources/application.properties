spring.application.name=agendaflex
server.port=8080

# Banco padrão: H2 em memória (sem instalar nada). Para MySQL use o perfil "mysql".
spring.datasource.url=jdbc:h2:mem:agendaflex;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Carrega profissionais, serviços, clientes e agendamentos de exemplo na primeira execução
agendaflex.dados-demo=true

# ---------------------------------------------------------------
# Regras de negócio configuráveis (valores padrão)
# ---------------------------------------------------------------
agendaflex.regras.antecedencia-minima-minutos=120
agendaflex.regras.antecedencia-maxima-dias=60
agendaflex.regras.antecedencia-minima-cancelamento-minutos=120
agendaflex.regras.maximo-reagendamentos=2
agendaflex.regras.maximo-agendamentos-ativos-por-cliente=3
agendaflex.regras.maximo-agendamentos-por-cliente-por-dia=2
agendaflex.regras.limite-faltas-para-bloqueio=3
agendaflex.regras.passo-slot-minutos=30
agendaflex.regras.hora-inicial-agenda=7
agendaflex.regras.hora-final-agenda=21
