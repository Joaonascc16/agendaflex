<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina('Serviços', 'servicos', ~{::section})}">
<body>
<section>
    <div class="cabecalho-pagina">
        <div>
            <h1>Serviços</h1>
            <p>A duração de cada serviço define o tamanho do horário na agenda.</p>
        </div>
        <a class="botao" th:href="@{/servicos/novo}">Novo serviço</a>
    </div>

    <div class="cartao">
        <div class="vazio" th:if="${#lists.isEmpty(servicos)}">
            <p>Nenhum serviço cadastrado.</p>
            <a class="botao" th:href="@{/servicos/novo}">Cadastrar serviço</a>
        </div>
        <div class="tabela-rolavel" th:unless="${#lists.isEmpty(servicos)}">
            <table class="tabela">
                <thead><tr><th>Serviço</th><th>Duração</th><th>Preço</th><th>Situação</th><th></th></tr></thead>
                <tbody>
                <tr th:each="s : ${servicos}">
                    <td>
                        <strong th:text="${s.nome}">Serviço</strong>
                        <div class="texto-suave" th:if="${s.descricao != null}" th:text="${s.descricao}">Descrição</div>
                    </td>
                    <td th:text="${s.duracaoMinutos + ' min'}">45 min</td>
                    <td th:text="${'R$ ' + #numbers.formatDecimal(s.preco, 1, 'POINT', 2, 'COMMA')}">R$ 60,00</td>
                    <td>
                        <span class="selo selo-ativo" th:if="${s.ativo}">Ativo</span>
                        <span class="selo selo-inativo" th:unless="${s.ativo}">Inativo</span>
                    </td>
                    <td class="acoes">
                        <a class="botao botao-secundario botao-pequeno" th:href="@{/servicos/{id}/editar(id=${s.id})}">Editar</a>
                        <form th:action="@{/servicos/{id}/excluir(id=${s.id})}" method="post"
                              onsubmit="return confirm('Excluir este serviço?')">
                            <button class="botao botao-perigo botao-pequeno" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
