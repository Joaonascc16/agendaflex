<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina('Serviço', 'servicos', ~{::section})}">
<body>
<section>
    <div class="cabecalho-pagina">
        <h1 th:text="${servico.id == null} ? 'Novo serviço' : 'Editar serviço'">Serviço</h1>
        <a class="botao botao-secundario" th:href="@{/servicos}">Voltar aos serviços</a>
    </div>

    <div class="cartao">
        <form class="formulario" th:action="@{/servicos}" th:object="${servico}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="campo">
                <label for="nome">Nome do serviço</label>
                <input type="text" id="nome" th:field="*{nome}" maxlength="100">
                <small class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</small>
            </div>
            <div class="campo">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" th:field="*{descricao}" maxlength="400"></textarea>
                <small class="erro-campo" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">Erro</small>
            </div>
            <div class="campo-linha">
                <div class="campo">
                    <label for="duracaoMinutos">Duração (minutos)</label>
                    <input type="number" id="duracaoMinutos" th:field="*{duracaoMinutos}" min="5" max="480" step="5">
                    <small class="erro-campo" th:if="${#fields.hasErrors('duracaoMinutos')}" th:errors="*{duracaoMinutos}">Erro</small>
                </div>
                <div class="campo">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" th:field="*{preco}" min="0" step="0.01">
                    <small class="erro-campo" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}">Erro</small>
                </div>
            </div>
            <label class="campo-marcar">
                <input type="checkbox" th:field="*{ativo}">
                <span>Serviço ativo (aparece nos novos agendamentos)</span>
            </label>
            <div class="acoes-form">
                <button class="botao" type="submit">Salvar serviço</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
