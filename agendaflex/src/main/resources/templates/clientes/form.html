<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina('Cliente', 'clientes', ~{::section})}">
<body>
<section>
    <div class="cabecalho-pagina">
        <h1 th:text="${cliente.id == null} ? 'Novo cliente' : 'Editar cliente'">Cliente</h1>
        <a class="botao botao-secundario" th:href="@{/clientes}">Voltar aos clientes</a>
    </div>

    <div class="cartao">
        <form class="formulario" th:action="@{/clientes}" th:object="${cliente}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}" maxlength="120">
                <small class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</small>
            </div>
            <div class="campo-linha">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" th:field="*{email}" maxlength="160">
                    <small class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Erro</small>
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" th:field="*{telefone}" maxlength="20">
                    <small class="erro-campo" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}">Erro</small>
                </div>
            </div>
            <label class="campo-marcar">
                <input type="checkbox" th:field="*{ativo}">
                <span>Cliente ativo (pode receber novos agendamentos)</span>
            </label>
            <div class="acoes-form">
                <button class="botao" type="submit">Salvar cliente</button>
            </div>
        </form>
    </div>

    <div class="cartao" th:if="${cliente.id != null}">
        <h2>Faltas</h2>
        <p>
            <span th:text="${cliente.faltas}">0</span> falta(s) registrada(s).
            <span th:if="${cliente.bloqueado}">Este cliente está bloqueado para novos agendamentos.</span>
        </p>
        <form th:if="${cliente.faltas > 0}" th:action="@{/clientes/{id}/zerar-faltas(id=${cliente.id})}" method="post"
              onsubmit="return confirm('Zerar as faltas deste cliente?')">
            <button class="botao botao-secundario" type="submit">Zerar faltas</button>
        </form>
    </div>

    <div class="cartao" th:if="${historico != null}">
        <h2>Histórico de agendamentos</h2>
        <p class="vazio" th:if="${#lists.isEmpty(historico)}">Este cliente ainda não tem agendamentos.</p>
        <div class="tabela-rolavel" th:unless="${#lists.isEmpty(historico)}">
            <table class="tabela">
                <thead><tr><th>Quando</th><th>Serviço</th><th>Profissional</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="a : ${historico}">
                    <td th:text="${#temporals.format(a.inicio, 'dd/MM/yyyy HH:mm')}">10/11/2026 09:00</td>
                    <td th:text="${a.servicoNome}">Serviço</td>
                    <td th:text="${a.profissionalNome}">Profissional</td>
                    <td><span th:replace="~{fragments/componentes :: seloStatus(${a.status})}"></span></td>
                    <td class="acoes"><a th:href="@{/agendamentos/{id}(id=${a.id})}">Abrir</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
