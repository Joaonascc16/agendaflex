<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina('Profissionais', 'profissionais', ~{::section})}">
<body>
<section>
    <div class="cabecalho-pagina">
        <div>
            <h1>Profissionais</h1>
            <p>Defina quais serviços cada pessoa realiza e em que horários ela atende.</p>
        </div>
        <a class="botao" th:href="@{/profissionais/novo}">Novo profissional</a>
    </div>

    <div class="cartao">
        <div class="vazio" th:if="${#lists.isEmpty(profissionais)}">
            <p>Nenhum profissional cadastrado.</p>
            <a class="botao" th:href="@{/profissionais/novo}">Cadastrar profissional</a>
        </div>
        <div class="tabela-rolavel" th:unless="${#lists.isEmpty(profissionais)}">
            <table class="tabela">
                <thead><tr><th>Nome</th><th>Especialidade</th><th>Serviços</th><th>Situação</th><th></th></tr></thead>
                <tbody>
                <tr th:each="p : ${profissionais}">
                    <td th:text="${p.nome}">Nome</td>
                    <td th:text="${p.especialidade}">Especialidade</td>
                    <td>
                        <span th:if="${#lists.isEmpty(p.servicosNomes)}" class="texto-suave">Nenhum serviço</span>
                        <span th:unless="${#lists.isEmpty(p.servicosNomes)}" th:text="${#strings.listJoin(p.servicosNomes, ', ')}">Corte, Barba</span>
                    </td>
                    <td>
                        <span class="selo selo-ativo" th:if="${p.ativo}">Ativo</span>
                        <span class="selo selo-inativo" th:unless="${p.ativo}">Inativo</span>
                    </td>
                    <td class="acoes">
                        <a class="botao botao-pequeno" th:href="@{/profissionais/{id}/disponibilidade(id=${p.id})}">Horários e bloqueios</a>
                        <a class="botao botao-secundario botao-pequeno" th:href="@{/profissionais/{id}/editar(id=${p.id})}">Editar</a>
                        <form th:action="@{/profissionais/{id}/excluir(id=${p.id})}" method="post"
                              onsubmit="return confirm('Excluir este profissional?')">
                            <button class="botao botao-perigo botao-pequeno" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
