<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina('Agendamentos', 'agendamentos', ~{::section})}">
<body>
<section>
    <div class="cabecalho-pagina">
        <h1>Agendamentos</h1>
        <a class="botao" th:href="@{/agendamentos/novo}">Novo agendamento</a>
    </div>

    <form class="filtros" method="get" th:action="@{/agendamentos}">
        <div class="campo">
            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="">Todos</option>
                <option th:each="s : ${statusOpcoes}" th:value="${s}" th:text="${s.descricao}"
                        th:selected="${s == statusSelecionado}">Agendado</option>
            </select>
        </div>
        <div class="campo">
            <label for="profissionalId">Profissional</label>
            <select id="profissionalId" name="profissionalId">
                <option value="">Todos</option>
                <option th:each="p : ${profissionais}" th:value="${p.id}" th:text="${p.nome}"
                        th:selected="${p.id == profissionalSelecionado}">Profissional</option>
            </select>
        </div>
        <button class="botao botao-secundario" type="submit">Filtrar</button>
        <a class="botao botao-secundario" th:href="@{/agendamentos}">Limpar filtros</a>
    </form>

    <div class="cartao">
        <div class="vazio" th:if="${#lists.isEmpty(agendamentos)}">
            <p>Nenhum agendamento encontrado com esses filtros.</p>
            <a class="botao" th:href="@{/agendamentos/novo}">Criar agendamento</a>
        </div>
        <div class="tabela-rolavel" th:unless="${#lists.isEmpty(agendamentos)}">
            <table class="tabela">
                <thead>
                <tr><th>Quando</th><th>Cliente</th><th>Serviço</th><th>Profissional</th><th>Status</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="a : ${agendamentos}">
                    <td th:text="${#temporals.format(a.inicio, 'dd/MM/yyyy HH:mm')}">10/11/2026 09:00</td>
                    <td th:text="${a.clienteNome}">Cliente</td>
                    <td th:text="${a.servicoNome}">Serviço</td>
                    <td th:text="${a.profissionalNome}">Profissional</td>
                    <td><span th:replace="~{fragments/componentes :: seloStatus(${a.status})}"></span></td>
                    <td class="acoes"><a th:href="@{/agendamentos/{id}(id=${a.id})}">Abrir</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
