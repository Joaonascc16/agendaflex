<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina('Agendamento', 'agendamentos', ~{::section})}">
<body>
<section>
    <div class="cabecalho-pagina">
        <div>
            <h1 th:text="${agendamento.servicoNome}">Serviço</h1>
            <p th:text="${#temporals.format(agendamento.inicio, 'dd/MM/yyyy') + ', das ' + #temporals.format(agendamento.inicio, 'HH:mm') + ' às ' + #temporals.format(agendamento.fim, 'HH:mm')}">10/11/2026, das 09:00 às 09:45</p>
        </div>
        <a class="botao botao-secundario" th:href="@{/agendamentos}">Voltar aos agendamentos</a>
    </div>

    <div class="cartao">
        <dl class="detalhes">
            <dt>Status</dt>
            <dd><span th:replace="~{fragments/componentes :: seloStatus(${agendamento.status})}"></span></dd>
            <dt>Cliente</dt>
            <dd><a th:href="@{/clientes/{id}/editar(id=${agendamento.clienteId})}" th:text="${agendamento.clienteNome}">Cliente</a></dd>
            <dt>Profissional</dt>
            <dd th:text="${agendamento.profissionalNome}">Profissional</dd>
            <dt>Valor</dt>
            <dd th:text="${'R$ ' + #numbers.formatDecimal(agendamento.preco, 1, 'POINT', 2, 'COMMA')}">R$ 60,00</dd>
            <dt th:if="${agendamento.observacoes != null}">Observações</dt>
            <dd th:if="${agendamento.observacoes != null}" th:text="${agendamento.observacoes}">Observações</dd>
            <dt th:if="${agendamento.vezesReagendado > 0}">Reagendamentos</dt>
            <dd th:if="${agendamento.vezesReagendado > 0}" th:text="${agendamento.vezesReagendado}">1</dd>
            <dt th:if="${agendamento.motivoCancelamento != null}">Motivo do cancelamento</dt>
            <dd th:if="${agendamento.motivoCancelamento != null}" th:text="${agendamento.motivoCancelamento}">Motivo</dd>
        </dl>

        <div class="acoes-form">
            <form th:if="${agendamento.podeConfirmar}" th:action="@{/agendamentos/{id}/confirmar(id=${agendamento.id})}" method="post">
                <button class="botao" type="submit">Confirmar</button>
            </form>
            <form th:if="${agendamento.podeFinalizar}" th:action="@{/agendamentos/{id}/concluir(id=${agendamento.id})}" method="post">
                <button class="botao" type="submit">Concluir atendimento</button>
            </form>
            <form th:if="${agendamento.podeFinalizar}" th:action="@{/agendamentos/{id}/faltou(id=${agendamento.id})}" method="post"
                  onsubmit="return confirm('Registrar que o cliente faltou? Isso soma uma falta ao cadastro dele.')">
                <button class="botao botao-secundario" type="submit">Registrar falta</button>
            </form>
            <a th:if="${agendamento.podeReagendar}" class="botao botao-secundario"
               th:href="@{/agendamentos/{id}/reagendar(id=${agendamento.id})}">Reagendar</a>
        </div>
    </div>

    <div class="cartao" th:if="${agendamento.podeCancelar}">
        <h2>Cancelar agendamento</h2>
        <form class="formulario" th:action="@{/agendamentos/{id}/cancelar(id=${agendamento.id})}" method="post">
            <div class="campo">
                <label for="motivo">Motivo do cancelamento</label>
                <input type="text" id="motivo" name="motivo" maxlength="200" required>
            </div>
            <div class="acoes-form">
                <button class="botao botao-perigo" type="submit">Cancelar agendamento</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
